name: CI
on: [push, pull_request]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: runner.os == 'Linux'
        run: sudo apt-get update
      - uses: crystal-lang/install-crystal@v1
        with:
          crystal: '1.19.1'
      - run: shards install
      - run: crystal tool format --check
      - run: shards build
      - run: crystal build --no-codegen examples/elevator.cr
      - run: crystal build --no-codegen examples/xp.cr
